contract_name: cdr_events_contract
version: v1
dataset_name: cdr_events
description: Contract for call detail record events used in bronze ingestion.
owners:
  - rakeshchandramandava28@gmail.com
schema:
  - name: event_id
    type: string
    nullable: false
    description: Unique event identifier.
  - name: event_type
    type: string
    nullable: false
  - name: timestamp
    type: timestamp
    nullable: false
  - name: caller_id
    type: string
    nullable: false
  - name: receiver_id
    type: string
    nullable: false
  - name: duration_sec
    type: integer
    nullable: false
quality_rules:
  - field: event_id
    required: true
    allow_duplicates: false
  - field: timestamp
    required: true
    max_null_ratio: 0.0
  - field: duration_sec
    max_null_ratio: 0.01
freshness:
  max_lag_ms: 5000